name: CI/CD & Quality Control GedungKu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # =========================================================
  # TAHAP 1: Pengecekan Kualitas & Kerapian Kode (Linting)
  # =========================================================
  lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mengatur agar proses TETAP LANJUT (sukses) meskipun ada kode berantakan
          DISABLE_ERRORS: true

  # =========================================================
  # TAHAP 2: Pengujian Aplikasi (Build & Test)
  # =========================================================
  build-test:
    name: Build and Test Application
    needs: lint # Wajib menunggu proses linting selesai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan file .env
        run: cp .env.example .env

      - name: Build dan jalankan semua container
        run: docker compose up -d --build

      - name: Uji API
        run: curl -f --retry 20 --retry-delay 3 --retry-all-errors http://localhost/api/gedung

      - name: Uji halaman frontend
        run: curl -f http://localhost/

      # TAMBAHAN 1: menampilkan status container pada halaman Summary
      - name: Ringkasan status container
        run: |
          echo "### Status container" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker compose ps >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Tampilkan log jika gagal
        if: failure()
        run: docker compose logs

      - name: Matikan container
        if: always()
        run: docker compose down -v

  # =========================================================
  # TAHAP 3: Publikasi Aplikasi (Continuous Delivery)
  # =========================================================
  publish:
    name: Publish to Docker Hub
    needs: build-test # Wajib menunggu proses pengujian sukses
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # TAMBAHAN 2: environment membuat panel Deployments muncul di halaman repositori
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/mirawatihutasoit/gedungku-api
    steps:
      - uses: actions/checkout@v4

      - name: Ambil nomor versi dari tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: mirawatihutasoit
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mirawatihutasoit/gedungku-api:${{ env.VERSION }}
            mirawatihutasoit/gedungku-api:latest

      - name: Push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            mirawatihutasoit/gedungku-frontend:${{ env.VERSION }}
            mirawatihutasoit/gedungku-frontend:latest

      # TAMBAHAN 3: menampilkan ringkasan image yang terbit pada halaman Summary
      - name: Ringkasan hasil publikasi
        run: |
          echo "### Image berhasil dipublikasikan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| mirawatihutasoit/gedungku-api | ${VERSION}, latest |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mirawatihutasoit/gedungku-frontend | ${VERSION}, latest |" >> "$GITHUB_STEP_SUMMARY"